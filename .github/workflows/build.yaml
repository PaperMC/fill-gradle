name: "build"

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:
  release:
    types: [ published ]

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: namespace-profile-linux-default
    steps:
      - name: "git / checkout"
        uses: "namespacelabs/nscloud-checkout-action@v9"
        with:
          persist-credentials: "false"
      - name: "java / setup"
        uses: "actions/setup-java@v5"
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "" # namespace handles this
      - name: Set up cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: gradle
      - name: Setup gradle build cache
        run: |
          nsc cache gradle setup --init-gradle /tmp/init.gradle
      - name: "gradle / setup"
        uses: "gradle/actions/setup-gradle@v6"
        with:
          cache-disabled: true # namespace handles this
      - name: "gradle / build"
        run: "./gradlew --init-script=/tmp/init.gradle build"
      - name: "gradle / determine version type"
        run: |
          if [ "$(./gradlew --init-script=/tmp/init.gradle properties | awk '/^version:/ { print $2; }' | grep '\-SNAPSHOT')" ]; then
            echo "VERSION_TYPE=snapshot" >> $GITHUB_ENV
          else
            echo "VERSION_TYPE=release" >> $GITHUB_ENV
          fi
      - name: "gradle / publish snapshot"
        if: "${{ env.VERSION_TYPE != 'release' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        run: ./gradlew --init-script=/tmp/init.gradle publish
        env:
          ORG_GRADLE_PROJECT_papermcUsername: "${{ secrets.ARTIFACTORY_USERNAME }}"
          ORG_GRADLE_PROJECT_papermcPassword: "${{ secrets.ARTIFACTORY_PASSWORD }}"
      - name: "gradle / publish release"
        if: "${{ env.VERSION_TYPE == 'release' && github.event_name == 'release' }}"
        run: ./gradlew --init-script=/tmp/init.gradle publishPlugins
        env:
          GRADLE_PUBLISH_KEY: "${{ secrets.GRADLE_PLUGIN_PORTAL_KEY }}"
          GRADLE_PUBLISH_SECRET: "${{ secrets.GRADLE_PLUGIN_PORTAL_SECRET }}"
